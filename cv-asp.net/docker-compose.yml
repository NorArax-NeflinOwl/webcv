name: cv-asp-net

services:
  app:
    image: cv-asp-net:latest
    build:
      # The repository root: the image also needs cv-shared (pages and migrations).
      context: ..
      dockerfile: cv-asp.net/Dockerfile
      args:
        BUILD_ID: ${BUILD_ID:-manual}
    ports:
      # [address:]port on the host, 8281 by default; the home server behind the gateway sets its LAN address.
      - "${APP_HOST_PORT:-8281}:8080"
    environment:
      ConnectionStrings__CvDatabase: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER}
      Database__Password: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  # Its own database: the migrations are shared with cv-spring-kotlin, the journal (DbUp vs Flyway) is not.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Published for "dotnet run"; 5443 by default, next to cv-spring-kotlin's database on 5442.
      - "${POSTGRES_HOST_PORT:-5443}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
