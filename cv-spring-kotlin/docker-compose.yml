name: cv-spring-kotlin

services:
  app:
    image: cv-spring-kotlin:latest
    build:
      # The repository root: the image also needs cv-shared (pages and migrations).
      context: ..
      dockerfile: cv-spring-kotlin/Dockerfile
      args:
        BUILD_ID: ${BUILD_ID:-manual}
    ports:
      - "8280:8280"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Published for "./gradlew bootRun"; POSTGRES_HOST_PORT in .env overrides the default 5442.
      - "${POSTGRES_HOST_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
