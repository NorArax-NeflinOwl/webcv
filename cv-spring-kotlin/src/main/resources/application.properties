spring.application.name=cv-spring-kotlin
server.port=${SERVER_PORT:8280}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5442/cvdb}
spring.datasource.username=${DATABASE_USERNAME:cvuser}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Pages, styles and scripts come from cv-shared/web (see build.gradle.kts)
spring.web.resources.static-locations=classpath:/web/
# Checked with the server on every load (an unchanged file costs a 304), so a browser never runs a cached old script
# against a newer API after a deploy.
spring.web.resources.cache.cachecontrol.no-cache=true