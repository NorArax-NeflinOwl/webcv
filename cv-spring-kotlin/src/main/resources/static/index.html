<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237fdbca' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='7' r='4'/><path d='M4 21v-2a8 8 0 0 1 16 0v2'/></svg>">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="container">

    <!-- Header -->
    <header class="header">
        <p class="header__eyebrow" id="eyebrow"></p>
        <h1 class="header__name" id="name"></h1>
        <p class="header__role" id="role"></p>
        <p class="header__bio" id="bio"></p>

        <!-- Linki dynamiczne (z API) + statyczne przyciski -->
        <div class="links" id="links">
            <a class="link-btn" href="/actuator/health" id="health-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                </svg>
                /actuator/health
            </a>
            <a class="link-btn" href="/api/hello">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12"/>
                    <path d="M11 11.5v-2a1.5 1.5 0 0 1 3 0V12"/>
                    <path d="M14 10.5a1.5 1.5 0 0 1 3 0V12"/>
                    <path d="M17 11.5a1.5 1.5 0 0 1 3 0V16a6 6 0 0 1-6 6h-2a7 7 0 0 1-7-7V5.5a1.5 1.5 0 0 1 3 0"/>
                </svg>
                Hello World
            </a>
            <a class="link-btn" href="/api/profileinfo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="7" r="4"/>
                    <path d="M4 21v-2a8 8 0 0 1 16 0v2"/>
                </svg>
                Profile Info
            </a>
        </div>
    </header>

    <!-- Technologies — wypełniane z API (data.technologies) -->
    <section class="section">
        <p class="section__label">// technologie</p>
        <div class="skills" id="skills-grid"></div>
    </section>

    <!-- Stack — wypełniane z API (data.stacks) -->
    <section class="section">
        <p class="section__label">// stack & narzędzia</p>
        <div class="stack" id="stack-chips"></div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="status">
            <div class="dot"></div>
            <!-- wypełniane z API (data.footer) -->
            <span id="footer-status"></span>
        </div>
        <span>Kotlin + Spring Boot + Docker — cv-spring-kotlin</span>
    </footer>

</div>
<script src="/main.js"></script>
</body>
</html>
