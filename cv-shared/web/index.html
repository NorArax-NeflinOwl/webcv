<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237fdbca' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='7' r='4'/><path d='M4 21v-2a8 8 0 0 1 16 0v2'/></svg>">
    <link rel="stylesheet" href="/css/indexStyle.css">
</head>
<body class="is-loading">
<!-- Until /api/profileinfo answers, the [data-skeleton] placeholders stand in for the profile (js/index.js swaps them). -->
<div class="container" aria-busy="true">

    <!-- Shown by js/index.js when the profile cannot be loaded -->
    <div class="load-error" id="load-error" role="alert" hidden>
        <p class="load-error__text" id="load-error-text"></p>
        <button class="link-btn load-error__retry" id="load-error-retry" type="button"></button>
    </div>

    <!-- Shown by js/index.js while it asks again for a profile the starting server could not give yet -->
    <p class="load-wait" id="load-wait" role="status" hidden>
        <span class="load-wait__dot" aria-hidden="true"></span>
        <span id="load-wait-text"></span>
    </p>

    <!-- Header -->
    <header class="header">
        <div class="header__top-row">
            <p class="header__eyebrow" id="eyebrow"><span class="skeleton skeleton--eyebrow" data-skeleton aria-hidden="true"></span></p>
            <!-- Language switcher -->
            <div class="lang-switcher" id="lang-switcher">
                <button class="lang-btn" data-lang="pl" title="Polski">🇵🇱</button>
                <button class="lang-btn" data-lang="en" title="English">🇬🇧</button>
            </div>
        </div>
        <h1 class="header__name" id="name"><span class="skeleton skeleton--name" data-skeleton aria-hidden="true"></span></h1>
        <p class="header__role" id="role"><span class="skeleton skeleton--role" data-skeleton aria-hidden="true"></span></p>
        <p class="header__bio" id="bio"><span class="skeleton skeleton--line" data-skeleton aria-hidden="true"></span><span class="skeleton skeleton--line" data-skeleton aria-hidden="true"></span><span class="skeleton skeleton--line skeleton--short" data-skeleton aria-hidden="true"></span></p>

        <!-- Linki dynamiczne (z API) + statyczne przyciski -->
        <div class="links" id="links">
            <span class="link-btn link-btn--skeleton" data-skeleton aria-hidden="true"><span class="skeleton skeleton--label"></span></span>
            <span class="link-btn link-btn--skeleton" data-skeleton aria-hidden="true"><span class="skeleton skeleton--label"></span></span>
            <span class="link-btn link-btn--skeleton" data-skeleton aria-hidden="true"><span class="skeleton skeleton--label"></span></span>
            <a class="link-btn" href="/actuator/health" id="health-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                </svg>
                /actuator/health
            </a>
            <a class="link-btn" href="/api/hello">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12"/>
                    <path d="M11 11.5v-2a1.5 1.5 0 0 1 3 0V12"/>
                    <path d="M14 10.5a1.5 1.5 0 0 1 3 0V12"/>
                    <path d="M17 11.5a1.5 1.5 0 0 1 3 0V16a6 6 0 0 1-6 6h-2a7 7 0 0 1-7-7V5.5a1.5 1.5 0 0 1 3 0"/>
                </svg>
                Hello World
            </a>
            <a class="link-btn" href="/api/profileinfo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="7" r="4"/>
                    <path d="M4 21v-2a8 8 0 0 1 16 0v2"/>
                </svg>
                Profile Info
            </a>
        </div>
    </header>

    <!-- Experience  populated from API (data.experiences) -->
    <section class="section">
        <p class="section__label">// experience</p>
        <div class="experience" id="experience-list">
            <div class="timeline-row timeline-row--skeleton" data-skeleton aria-hidden="true"><span class="skeleton skeleton--period"></span><span class="skeleton skeleton--company"></span><span class="skeleton skeleton--position"></span></div>
            <div class="timeline-row timeline-row--skeleton" data-skeleton aria-hidden="true"><span class="skeleton skeleton--period"></span><span class="skeleton skeleton--company"></span><span class="skeleton skeleton--position"></span></div>
            <div class="timeline-row timeline-row--skeleton" data-skeleton aria-hidden="true"><span class="skeleton skeleton--period"></span><span class="skeleton skeleton--company"></span><span class="skeleton skeleton--position"></span></div>
        </div>
    </section>
    <!-- Technologies  populated from API (data.technologies) -->
    <section class="section">
        <p class="section__label">// technologies</p>
        <div class="skills" id="skills-grid">
            <div class="skill-item skill-item--skeleton" data-skeleton aria-hidden="true"><span class="skeleton skeleton--skill"></span><span class="skeleton skeleton--tag"></span></div>
            <div class="skill-item skill-item--skeleton" data-skeleton aria-hidden="true"><span class="skeleton skeleton--skill"></span><span class="skeleton skeleton--tag"></span></div>
            <div class="skill-item skill-item--skeleton" data-skeleton aria-hidden="true"><span class="skeleton skeleton--skill"></span><span class="skeleton skeleton--tag"></span></div>
            <div class="skill-item skill-item--skeleton" data-skeleton aria-hidden="true"><span class="skeleton skeleton--skill"></span><span class="skeleton skeleton--tag"></span></div>
            <div class="skill-item skill-item--skeleton" data-skeleton aria-hidden="true"><span class="skeleton skeleton--skill"></span><span class="skeleton skeleton--tag"></span></div>
            <div class="skill-item skill-item--skeleton" data-skeleton aria-hidden="true"><span class="skeleton skeleton--skill"></span><span class="skeleton skeleton--tag"></span></div>
        </div>
    </section>

    <!-- Stack  populated from API (data.stacks) -->
    <section class="section">
        <p class="section__label">// stack & tools</p>
        <div class="stack" id="stack-chips">
            <span class="chip chip--skeleton" data-skeleton aria-hidden="true"></span>
            <span class="chip chip--skeleton" data-skeleton aria-hidden="true"></span>
            <span class="chip chip--skeleton" data-skeleton aria-hidden="true"></span>
            <span class="chip chip--skeleton" data-skeleton aria-hidden="true"></span>
            <span class="chip chip--skeleton" data-skeleton aria-hidden="true"></span>
            <span class="chip chip--skeleton" data-skeleton aria-hidden="true"></span>
            <span class="chip chip--skeleton" data-skeleton aria-hidden="true"></span>
            <span class="chip chip--skeleton" data-skeleton aria-hidden="true"></span>
        </div>
    </section>

    <section class="section">
        <p class="section__label">// game</p>
        <a class="link-btn" href="/pandaGame.html">
            🐼 Panda Runner
        </a>
        <a class="link-btn" href="/api/pandagame/scores">
            🐼 Scores
        </a>
        <a class="link-btn" href="/pokerGame.html">
            ♠ Poker
        </a>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="status">
            <div class="dot"></div>
            <!-- populated from API (data.footer) -->
            <span id="footer-status"><span class="skeleton skeleton--footer" data-skeleton aria-hidden="true"></span></span>
        </div>
        <!-- populated from API (/api/backend)  the page is shared by both backends -->
        <span id="backend-label"></span>
    </footer>
</div>
<script src="/js/index.js"></script>
</body>
</html>
